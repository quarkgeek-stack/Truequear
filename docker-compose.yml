services:
  postgres:
    image: postgres:16-alpine
    container_name: truequear-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: truequear
    ports:
      - "5432:5432"
    volumes:
      - truequear_pgdata:/var/lib/postgresql/data

volumes:
  truequear_pgdata:
